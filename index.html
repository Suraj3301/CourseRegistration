
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online College Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eef2f7;
            padding: 30px 15px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .header {
            background: #173b70;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        .header h1 {
            margin-bottom: 10px;
        }

        .header p {
            color: #dce8f8;
        }

        form {
            padding: 30px;
        }

        .section-title {
            color: #173b70;
            border-bottom: 2px solid #173b70;
            padding-bottom: 8px;
            margin: 25px 0 18px;
            font-size: 19px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input, select, textarea {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #173b70;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .gender-options {
            display: flex;
            gap: 20px;
            padding: 10px 0;
        }

        .gender-options label {
            font-weight: normal;
        }

        .gender-options input {
            width: auto;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            padding: 13px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .submit-btn {
            background: #173b70;
            color: white;
            flex: 1;
        }

        .submit-btn:hover {
            background: #0e2850;
        }

        .reset-btn {
            background: #e2e6ec;
            color: #333;
        }

        #successMessage {
            display: none;
            margin: 20px 30px;
            padding: 15px;
            background: #d4edda;
            color: #155724;
            border-radius: 6px;
            text-align: center;
        }

        .footer {
            text-align: center;
            padding: 18px;
            background: #f4f6f9;
            color: #666;
            font-size: 13px;
        }

        @media(max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            form {
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>ABC College</h1>
        <p>Online Student Registration Portal</p>
        <p>Academic Year 2026-2027</p>
    </div>

    <div id="successMessage">
        Registration submitted successfully!
    </div>

    <form id="registrationForm">

        <h3 class="section-title">Personal Information</h3>

        <div class="form-row">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Date of Birth *</label>
                <input type="date" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label>Mobile Number *</label>
                <input type="tel" pattern="[0-9]{10}"
                       maxlength="10" placeholder="10-digit mobile number" required>
            </div>
        </div>

        <div class="form-group">
            <label>Gender *</label>
            <div class="gender-options">
                <label><input type="radio" name="gender" value="Male" required> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
                <label><input type="radio" name="gender" value="Other"> Other</label>
            </div>
        </div>

        <h3 class="section-title">Academic Information</h3>

        <div class="form-row">
            <div class="form-group">
                <label>Course *</label>
                <select required>
                    <option value="">Select Course</option>
                    <option>B.Tech</option>
                    <option>B.Sc</option>
                    <option>B.Com</option>
                    <option>BBA</option>
                    <option>MBA</option>
                    <option>MCA</option>
                </select>
            </div>

            <div class="form-group">
                <label>Department *</label>
                <select required>
                    <option value="">Select Department</option>
                    <option>Computer Science Engineering</option>
                    <option>Information Technology</option>
                    <option>Electronics Engineering</option>
                    <option>Mechanical Engineering</option>
                    <option>Civil Engineering</option>
                    <option>Electrical Engineering</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Admission Year *</label>
                <select required>
                    <option value="">Select Year</option>
                    <option>2026</option>
                    <option>2027</option>
                </select>
            </div>

            <div class="form-group">
                <label>Previous Qualification *</label>
                <select required>
                    <option value="">Select Qualification</option>
                    <option>Intermediate (12th)</option>
                    <option>Diploma</option>
                    <option>Graduation</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Previous Percentage (%) *</label>
                <input type="number" min="0" max="100"
                       step="0.01" placeholder="Enter percentage" required>
            </div>

            <div class="form-group">
                <label>Roll Number (if applicable)</label>
                <input type="text" placeholder="Enter roll number">
            </div>
        </div>

        <h3 class="section-title">Address Information</h3>

        <div class="form-group" style="margin-bottom:18px;">
            <label>Full Address *</label>
            <textarea placeholder="Enter your complete address" required></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>City *</label>
                <input type="text" placeholder="Enter city" required>
            </div>

            <div class="form-group">
                <label>State *</label>
                <input type="text" placeholder="Enter state" required>
            </div>
        </div>

        <div class="form-group">
            <label>PIN Code *</label>
            <input type="text" pattern="[0-9]{6}"
                   maxlength="6" placeholder="6-digit PIN code" required>
        </div>

        <h3 class="section-title">Declaration</h3>

        <div class="form-group">
            <label style="font-weight:normal;">
                <input type="checkbox" required style="width:auto;">
                I hereby declare that all the information provided above is correct.
            </label>
        </div>

        <div class="buttons">
            <button type="submit" class="submit-btn">
                Submit Registration
            </button>

            <button type="reset" class="reset-btn">
                Reset Form
            </button>
        </div>

    </form>

    <div class="footer">
        © 2026 ABC College | Online Registration System
    </div>

</div>

<script>
    const form = document.getElementById("registrationForm");
    const successMessage = document.getElementById("successMessage");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        if (form.checkValidity()) {
            successMessage.style.display = "block";

            form.reset();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }
    });

    form.addEventListener("reset", function() {
        successMessage.style.display = "none";
    });
</script>

</body>
</html>
